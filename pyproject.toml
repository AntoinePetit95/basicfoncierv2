[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basicfoncierv2"
version = "0.0.1"
description = "Références cadastrales et superficies foncières, vectorisées sur pandas"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Antoine PETIT", email = "antoine.petit@energie-fonciere.fr" }]
keywords = ["foncier", "cadastre", "parcelle", "pandas"]
# Bornes vérifiées par la matrice de .github/workflows/tests.yml, pas déclarées de
# confiance — Python 3.10 à 3.12 y sont testés. numpy n'y figure pas : le paquet ne
# l'importe pas, pandas s'en charge.
# À savoir : pandas 3.0 exige Python >= 3.11 ; sous 3.10, la résolution s'arrête à la 2.3.
dependencies = [
    "pandas>=2.1.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/AntoinePetit95/basicfoncierv2"

[tool.setuptools.packages.find]
include = ["basicfoncierv2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Aligné sur requires-python : ruff doit refuser une syntaxe que le plancher ne comprend pas.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
