[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basicfoncier"
version = "1.0.0"
description = "Références cadastrales et superficies foncières, vectorisées sur pandas"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Antoine PETIT", email = "antoine.petit@lilo.org" }]
keywords = ["foncier", "cadastre", "parcelle", "insee", "pandas", "pyarrow"]
# Pas de classificateur « License :: » : la licence est déjà déclarée en expression
# PEP 639 ci-dessus, et les deux ensemble sont refusés.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Bornes vérifiées par la matrice de .github/workflows/tests.yml, pas déclarées de
# confiance — Python 3.10 à 3.12 y sont testés. numpy n'y figure pas : le paquet ne
# l'importe pas, pandas s'en charge.
# À savoir : pandas 3.0 exige Python >= 3.11 ; sous 3.10, la résolution s'arrête à la 2.3.
dependencies = [
    "pandas>=2.1.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/AntoinePetit95/basicfoncier"
Changelog = "https://github.com/AntoinePetit95/basicfoncier/blob/main/CHANGELOG.md"
Issues = "https://github.com/AntoinePetit95/basicfoncier/issues"

[tool.setuptools.packages.find]
include = ["basicfoncier*"]

# Sans ce marqueur, les annotations du paquet sont ignorées par mypy et les éditeurs :
# l'utilisateur ne voit rien du typage, pourtant complet.
[tool.setuptools.package-data]
basicfoncier = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# Aligné sur requires-python : ruff doit refuser une syntaxe que le plancher ne comprend pas.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
